<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ändere pro Zug einen Buchstaben und erreiche das Zielwort.">
  <title>Wordle · brainly</title>
  <link rel="icon" href="../assets/miffy.png" type="image/png">
  <!-- Ich lese Sprache und Farben beim Laden, damit die Seite direkt zu den Einstellungen aus Sudoku passt. -->
  <meta name="theme-color" content="#fff">
  <script>
    const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = preferredTheme;
    try {
      document.documentElement.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') || preferredTheme;
    } catch {
      // Wenn der Browser den Speicher blockiert, verwende ich die Systemeinstellung.
    }
  </script>
  <!-- Im Stylesheet sammle ich gemeinsame Regeln und ergänze für jedes Spiel eigene Regeln. -->
  <link rel="stylesheet" href="../styles/style.css?v=85">
  <script src="../scripts/text.js?v=22" defer></script>
  <script src="../scripts/site-shell.js?v=20" defer></script>
  <script src="../scripts/navigation.js?v=5" defer></script>
  <script src="../scripts/wordle.js?v=7" defer></script>
  <script src="../scripts/characters.js?v=10" defer></script>
  <script src="../scripts/levels.js?v=11" defer></script>
  <script src="../scripts/app.js?v=10" defer></script>
  <script src="../scripts/account.js?v=9" data-publishable-key="pk_test_d2FybS1wYW5kYS00MjY1LmNsZXJrLmFjY291bnRzLmRldiQ" defer></script>
</head>
<body class="word-ladder" data-game="wordle">

  <!-- Wordle: Ich zeige Start, Ziel und die bisher gespielten Wörter. -->
  <main>
    <div class="intro">
      <h1 data-text="ladderName">Wordle</h1>
      <p data-text="ladderRules">Ändere pro Zug genau einen Buchstaben, bis du das Zielwort erreichst.</p>
    </div>
    <section class="ladder-game" aria-labelledby="ladder-puzzle-label">
      <label id="ladder-puzzle-label" for="ladder-puzzle" data-text="ladderPuzzle">Rätsel wählen</label>
      <select id="ladder-puzzle"></select>
      <dl class="ladder-words">
        <div><dt data-text="ladderStart">Startwort</dt><dd id="ladder-start"></dd></div>
        <div><dt data-text="ladderTarget">Zielwort</dt><dd id="ladder-target"></dd></div>
      </dl>
      <ol id="ladder-path" data-label="ladderPath"></ol>
      <form id="ladder-form">
        <label for="ladder-input" data-text="ladderNext">Nächstes Wort</label>
        <input id="ladder-input" type="text" spellcheck="false" autocomplete="off" autocapitalize="characters" required>
        <div class="ladder-actions">
          <button id="ladder-submit" type="submit" data-text="ladderCheck">Wort prüfen</button>
          <button id="ladder-undo" type="button" data-text="ladderUndo">Zug zurück</button>
          <button id="ladder-reset" type="reset" data-text="reset">Zurücksetzen</button>
        </div>
      </form>
      <p id="ladder-status" role="status"></p>
    </section>
  </main>
</body>
</html>
