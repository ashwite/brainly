<!doctype html>
<!-- Ich setze Deutsch als Ausgangssprache für die Seite. -->
<html lang="de">
<!-- Ich definiere im Kopfbereich den Tab-Titel und lade das Design und die Skripte für diese Seite. -->
<head>
  <!-- Ich verwende UTF-8, damit Umlaute und Symbole korrekt erscheinen. -->
  <meta charset="utf-8">
  <!-- Ich richte die Seitenbreite an der Breite des Geräts aus. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Ich lege die Ausgangsfarbe der Browserleiste fest. -->
  <meta name="theme-color" content="#fff">
  <!-- Ich setze den Titel für den Browser-Tab. -->
  <title>brainly</title>
  <!-- Ich lade das Symbol für den Browser-Tab. -->
  <link rel="icon" href="../assets/miffy.png" type="image/png">
  <!-- Ich stelle das gespeicherte Farbschema und die Sprache vor dem Rendern wieder her. -->
  <script>
    const root = document.documentElement
    root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    try {
      root.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de'
      root.dataset.theme = localStorage.getItem('sudoku-theme') || root.dataset.theme
    } catch {
      // Wenn der Browser den Speicher blockiert, verwende ich die Vorgaben.
    }
  </script>
  <!-- Ich lade das gemeinsame Design mit einer Versionsnummer für den Browsercache. -->
  <link rel="stylesheet" href="../styles/style.css?v=205">
  <!-- Ich lade Übersetzungen und gemeinsame Bedienelemente zuerst. defer wartet, bis die Seite eingelesen ist. -->
  <script src="../scripts/text.js?v=35" defer></script>
  <!-- Ich erzeuge Navigation, Kopfzeile und Footer aus der gemeinsamen Vorlage. -->
  <script src="../scripts/site-shell.js?v=39" defer></script>
  <!-- Ich verbinde die Schalter für Sprache und Farbschema mit der Seite. -->
  <script src="../scripts/navigation.js?v=5" defer></script>
  <!-- Ich lade die gewählte Figur für das Profil oder die Rückmeldung am Rundenende. -->
  <script src="../scripts/characters.js?v=11" defer></script>
  <!-- Ich lade die gemeinsamen XP und den Fortschritt für die Level-Anzeige. -->
  <script src="../scripts/levels.js?v=14" defer></script>
  <!-- Ich erstelle auf Wunsch ein teilbares Bild aus Figur und Levelstand. -->
  <script src="../scripts/level-share.js?v=1" defer></script>
  <!-- Ich binde die Kontoanmeldung und den Abgleich der Spielstände ein. -->
  <script src="../scripts/account.js?v=9" data-publishable-key="pk_test_d2FybS1wYW5kYS00MjY1LmNsZXJrLmFjY291bnRzLmRldiQ" defer></script>
</head>
<!-- Ich beginne hier mit dem sichtbaren Seiteninhalt. -->
<body>
  <!-- Ich zeige hier den Fortschritt und das Charakterprofil. Ich erzeuge die Spiel-Links in der gemeinsamen Kopf- und Fußnavigation. -->
  <main>
    <!-- Ich gruppiere hier einen eigenen Abschnitt des Seiteninhalts. -->
    <section id="level" class="home-level" aria-labelledby="level-title" tabindex="-1">
      <!-- Ich fülle die Level-Anzeige mit den XP aus levels.js. Der Teilen-Button startet die PNG-Erstellung. -->
      <section class="level-summary" aria-labelledby="level-title">
        <!-- Ich stelle für diese Aktion einen eigenen Button bereit. -->
        <button id="level-share" type="button" data-label="shareLevel" aria-label="Level als PNG teilen">
          <!-- Ich zeichne das Symbol als Vektorgrafik im Button. -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V3m-4 4 4-4 4 4M7 11H5v10h14V11h-2"/>
          </svg>
        </button>
        <!-- Ich kennzeichne mit dieser Überschrift den Beginn des zugehörigen Abschnitts. -->
        <h1 id="level-title" data-level-status>Level 1 · 0 XP</h1>
        <!-- Ich verknüpfe die Beschriftung mit dem passenden Eingabefeld. -->
        <label id="level-next" for="level-progress">0 / 1.000 XP → Level 2</label>
        <!-- Ich zeige den Fortschritt bis zur nächsten Tausendergrenze an. -->
        <progress id="level-progress" max="1000" value="0"></progress>
        <!-- Ich lasse die aktualisierte Meldung von Screenreadern vorlesen. -->
        <p id="level-share-status" role="status"></p>
      </section>
      <div class="level-character-settings">
        <div class="level-character-profile">
          <!-- Ich stelle für diese Aktion einen eigenen Button bereit. -->
          <button id="character-toggle" class="character-toggle" type="button" aria-controls="character-picker"
            aria-expanded="false" data-label="chooseCharacter" aria-label="Charakter wählen">
            <!-- Ich lade das Bild mit den angegebenen Maßen und der passenden Alternativbeschreibung. -->
            <img id="level-character" width="144" height="144" alt="" hidden>
          </button>
          <div class="level-name">
            <!-- Ich verknüpfe die Beschriftung mit dem passenden Eingabefeld. -->
            <label for="level-name" data-text="playerName">Dein Name</label>
            <!-- Ich biete ein Eingabefeld für den lokal gespeicherten Anzeigenamen an. -->
            <input id="level-name" type="text" autocomplete="nickname" maxlength="40" placeholder="Anni">
            <!-- Ich stelle für diese Aktion einen eigenen Button bereit. -->
            <button id="account-session" type="button" data-text="accountSignIn" hidden>Anmelden</button>
          </div>
        </div>
        <!-- Ich lasse die Auswahl eingeklappt, bis jemand das Charakterbild anklickt. -->
        <fieldset id="character-picker" class="character-picker" hidden>
          <!-- Ich gebe der Auswahlgruppe eine gemeinsame Beschriftung. -->
          <legend class="sr-only" data-text="chooseCharacter">Charakter wählen</legend>
          <div class="character-choices">
            <!-- Ich füge hier die verfügbaren Charakterbilder zur Auswahl ein. -->
            <div id="character-options"></div>
            <!-- Ich verknüpfe die Beschriftung mit dem passenden Eingabefeld. -->
            <label class="character-upload-label">
              <!-- Ich lasse ein eigenes PNG vom Gerät auswählen. -->
              <input id="character-upload" class="sr-only" type="file" accept=".png,image/png" data-label="uploadCharacter" aria-label="Eigenes PNG auswählen" disabled>
              <span aria-hidden="true">+</span>
            </label>
          </div>
          <!-- Ich lasse die aktualisierte Meldung von Screenreadern vorlesen. -->
          <p id="character-upload-status" role="status"></p>
          <!-- Ich lasse diesen Text über den hinterlegten Übersetzungsschlüssel an die Seitensprache anpassen. -->
          <p id="character-empty" data-text="noCharacters" hidden>Die Charakterbilder sind noch nicht verfügbar.</p>
        </fieldset>
      </div>
    </section>
  </main>
</body>
</html>
