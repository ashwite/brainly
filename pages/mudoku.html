<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ordne vier Verdächtige ihren Räumen zu und löse den Fall.">
  <title>Mudoku · Der letzte Termin</title>
  <link rel="icon" href="../assets/miffy.png" type="image/png">
  <!-- Ich lese Sprache und Farben beim Laden, damit die Seite direkt zu den Einstellungen aus Sudoku passt. -->
  <meta name="theme-color" content="#fff">
  <script>
    const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = preferredTheme;
    try {
      document.documentElement.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') || preferredTheme;
    } catch {
      // Wenn der Browser den Speicher blockiert, verwende ich die Systemeinstellung.
    }
  </script>
  <!-- Im Stylesheet sammle ich gemeinsame Regeln und ergänze für jedes Spiel eigene Regeln. -->
  <link rel="stylesheet" href="../styles/style.css?v=64">
  <script src="../scripts/text.js?v=21" defer></script>
  <script src="../scripts/site-shell.js?v=17" defer></script>
  <script src="../scripts/navigation.js?v=5" defer></script>
  <script src="../scripts/cases.js?v=0.8" defer></script>
  <script src="../scripts/characters.js?v=10" defer></script>
  <script src="../scripts/levels.js?v=11" defer></script>
  <script src="../scripts/app.js?v=10" defer></script>
  <script src="../scripts/account.js?v=6" data-publishable-key="pk_test_d2FybS1wYW5kYS00MjY1LmNsZXJrLmFjY291bnRzLmRldiQ" defer></script>
</head>
<body class="mudoku" data-game="mudoku">

  <!-- Hier baue ich die Spielfläche für Mudoku auf. -->
  <main>
    <div class="intro">
      <h1 id="case-title"></h1>
      <p id="case-intro"></p>
      <div class="case-selection">
        <label for="case-picker" data-text="chooseCase">Fall auswählen</label>
        <select id="case-picker"></select>
      </div>
    </div>

    <div class="case-layout">
      <section class="panel" aria-labelledby="clue-title">
        <h2 id="clue-title" data-text="clues">Fallakte</h2>
        <p data-text="rules">Die vier Verdächtigen waren zur Tatzeit in vier verschiedenen Räumen. Nur die Person am Tatort war beim Opfer.</p>
        <p id="lie-rule" data-text="lieRule" hidden>Genau eine der Aussagen ist falsch.</p>
        <ol id="clues"></ol>
      </section>

      <!-- In app.js fülle ich die Raumfelder und ergänze bei bestimmten Fällen die Auswahl der falschen Aussage. -->
      <form class="panel" id="case-form">
        <h2 data-text="rooms">Flurplan</h2>
        <p data-text="instructions">Die Räume liegen in der gezeigten Reihenfolge von links nach rechts. Ordne jedem Raum eine Person zu.</p>
        <ol id="rooms"></ol>

        <label for="suspect" data-text="accusation">Wer hat die Tat begangen?</label>
        <select id="suspect" required></select>

        <div id="lie-field" hidden>
          <label for="false-clue" data-text="falseClue">Welche Aussage ist falsch?</label>
          <select id="false-clue" disabled></select>
        </div>
        <p id="field-errors" role="status"></p>

        <div class="actions">
          <button type="submit" data-text="solve">Fall lösen</button>
          <button type="reset" class="secondary" data-text="reset">Zurücksetzen</button>
        </div>
        <p id="feedback" role="status"></p>
      </form>
    </div>

    <!-- Ich zeige die Auflösung, sobald alle Antworten richtig sind. -->
    <section id="solution" class="panel solution" aria-labelledby="solution-title" hidden>
      <h2 id="solution-title" data-text="solution">Auflösung</h2>
      <p id="solution-text"></p>
    </section>
  </main>
</body>
</html>
