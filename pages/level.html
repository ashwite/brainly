<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dein Level und deine XP aus Sudoku, Mudoku und Wordle.">
  <title>Level · Kleine Denkpause</title>
  <link rel="icon" href="../assets/miffy.png" type="image/png">
  <!-- Ich lese Sprache und Farben beim Laden, damit die Seite direkt zu den Einstellungen aus Sudoku passt. -->
  <meta name="theme-color" content="#fff">
  <script>
    const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = preferredTheme;
    try {
      document.documentElement.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') || preferredTheme;
      document.documentElement.dataset.palette = localStorage.getItem('sudoku-palette') || 'mono';
    } catch {
      // Wenn der Browser den Speicher blockiert, verwende ich die Systemeinstellung.
    }
  </script>
  <!-- Im Stylesheet sammle ich gemeinsame Regeln und ergänze für jedes Spiel eigene Regeln. -->
  <link rel="stylesheet" href="../styles/style.css?v=24">
  <script src="../scripts/text.js?v=9" defer></script>
  <script src="../scripts/site-shell.js?v=2" defer></script>
  <script src="../scripts/navigation.js?v=2" defer></script>
  <script src="../scripts/characters.js?v=7" defer></script>
  <script src="../scripts/levels.js?v=8" defer></script>
  <script src="../scripts/level-share.js?v=1" defer></script>
  <script src="../scripts/account.js?v=3" data-publishable-key="pk_test_d2FybS1wYW5kYS00MjY1LmNsZXJrLmFjY291bnRzLmRldiQ" defer></script>
</head>
<body>
  <main class="level-page">
    <section class="level-summary" aria-labelledby="level-title">
      <button id="level-share" type="button" data-label="shareLevel" aria-label="Level als PNG teilen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15V3m-4 4 4-4 4 4M7 11H5v10h14V11h-2"/>
        </svg>
      </button>
      <img id="level-character" width="144" height="144" alt="" hidden>
      <h1 id="level-title" data-level-status>Level 1 · 0 XP</h1>
      <label id="level-next" for="level-progress">0 / 1.000 XP → Level 2</label>
      <progress id="level-progress" max="1000" value="0"></progress>
      <p id="level-share-status" role="status"></p>
    </section>
    <div class="level-name">
      <label for="level-name" data-text="playerName">Dein Name</label>
      <input id="level-name" type="text" autocomplete="nickname" maxlength="40" placeholder="Anni">
    </div>
    <fieldset class="character-picker">
      <legend data-text="chooseCharacter">Charakter wählen</legend>
      <div class="character-choices">
        <div id="character-options"></div>
        <label class="character-upload-label">
          <input id="character-upload" class="sr-only" type="file" accept=".png,image/png" data-label="uploadCharacter" aria-label="Eigenes PNG auswählen" disabled>
          <span aria-hidden="true">+</span>
        </label>
      </div>
      <p id="character-upload-status" role="status"></p>
      <p id="character-empty" data-text="noCharacters" hidden>Die Charakterbilder sind noch nicht verfügbar.</p>
    </fieldset>
    <ul class="level-games">
      <li><a href="sudoku.html">Sudoku <span data-game-xp="sudoku">0 XP</span></a></li>
      <li><a href="mudoku.html">Mudoku <span data-game-xp="mudoku">0 XP</span></a></li>
      <li><a href="wordle.html">Wordle <span data-game-xp="wordle">0 XP</span></a></li>
    </ul>
    <p id="level-rules">Mit Hilfestellung gibt es 50 XP pro gelöstem Rätsel, ohne Hilfestellung 100 XP.</p>
  </main>
</body>
</html>
