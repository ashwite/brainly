<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/miffy.png">
  <title>Impressum · Sudoku</title>
  <!-- Gespeicherte Farben vor dem Laden anzeigen: verhindert ein kurzes Aufblitzen. -->
  <!-- Ich lese die gespeicherten Einstellungen so früh, dass die Seite gleich in den passenden Farben erscheint. -->
  <script>
    try {
      document.documentElement.dataset.palette = localStorage.getItem('sudoku-palette') || 'mono';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      // Die Seite funktioniert auch, wenn der Browser das Speichern blockiert.
    }
  </script>
  <link rel="stylesheet" href="../styles/style.css?v=0.3">
</head>

</html>
