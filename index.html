<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff">
  <meta name="description" content="Denken statt scrollen. Sudoku mit drei Schwierigkeitsstufen und automatischem Spielstand.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/miffy.png">
  <title>Sudoku · Denken statt scrollen</title>

  <!-- Ich wende die gespeicherten Farben früh an, damit die Standardfarben nicht kurz aufblitzen. -->
  <!-- Ich lese die gespeicherten Einstellungen so früh, dass die Seite gleich in den passenden Farben erscheint. -->
  <script>
    try {
      document.documentElement.lang = localStorage.getItem('sudoku-language') === 'en' ? 'en' : 'de';
      document.documentElement.dataset.palette = localStorage.getItem('sudoku-palette') || 'mono';
      document.documentElement.dataset.theme = localStorage.getItem('sudoku-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {
      // Wenn der Browser den Speicher blockiert, verwende ich die Vorgaben.
    }
  </script>
  <!-- Im Stylesheet sammle ich gemeinsame Regeln und ergänze für jedes Spiel eigene Regeln. -->
  <link rel="stylesheet" href="styles/style.css?v=19">
  <!-- Ich lade zuerst die Spiellogik und dann die Konto-Funktionen. defer wartet mit der Ausführung, bis das HTML eingelesen ist. -->
  <script src="scripts/text.js?v=4" defer></script>
  <script src="scripts/navigation.js?v=2" defer></script>
  <script src="scripts/characters.js?v=6" defer></script>
  <script src="scripts/levels.js?v=7" defer></script>
  <script src="scripts/app.js?v=8" defer></script>
  <script src="scripts/account.js?v=2" data-publishable-key="pk_test_d2FybS1wYW5kYS00MjY1LmNsZXJrLmFjY291bnRzLmRldiQ" defer></script>
</head>
<body data-game="sudoku">
  <!-- Ich platziere das Logo links, den Schriftzug mittig und die Einstellungen rechts. -->
  <header>
    <a class="brand" href="./" data-label="sudokuHome" aria-label="Sudoku Startseite">
      <span class="brand-icon">
        <img class="logo-light" src="assets/logo/logo-light.png" alt="Hannah">
        <img class="logo-dark" src="assets/logo/logo-dark.png" alt="Hannah">
      </span>
      <span class="brand-wordmark">sudoku</span>
    </a>

    <div class="header-actions">
      <button id="menu-toggle" class="menu-toggle" aria-label="Menü öffnen"
        aria-expanded="false" aria-controls="navigation">
        <span></span>
        <span></span>
      </button>

      <!-- Ich halte das Menü zunächst geschlossen und steuere es in navigation.js. -->
      <nav id="navigation" class="navigation" data-label="settings" aria-label="Spieleinstellungen" hidden>
        <div class="nav-group">
          <span class="nav-label" data-text="language">Sprache</span>
          <div class="languages" role="group" data-label="language" aria-label="Sprache">
            <button data-language="de" lang="de">Deutsch</button>
            <button data-language="en" lang="en">English</button>
          </div>
        </div>
        <div class="nav-group">
          <span class="nav-label" data-text="colors">Farbtheme</span>
          <!-- In navigation.js erstelle ich die Farbpunkte. -->
          <div id="palettes" class="palettes" data-label="colors" aria-label="Farbtheme">
            <button type="button" class="theme-toggle" aria-label="Dunkelmodus einschalten" aria-pressed="false">
              <span aria-hidden="true">☾</span>
            </button>
          </div>
        </div>

        <div class="nav-group">
          <span class="nav-label" data-text="difficulty">Schwierigkeit</span>
          <div class="levels" data-label="difficulty" aria-label="Schwierigkeitsgrad">
            <button data-text="easy" data-level="easy">Leicht</button>
            <button data-text="medium" data-level="medium">Mittel</button>
            <button data-text="hard" data-level="hard">Schwer</button>
          </div>
        </div>
        <!-- Hier platziere ich die Konto-Buttons und verknüpfe sie in account.js mit Clerk. -->
        <div class="nav-group" id="account">
          <span class="nav-label" data-text="account">Konto</span>
          <button id="account-sign-in" data-text="accountSignIn" type="button" hidden>Anmelden</button>
          <button id="account-sign-up" data-text="accountSignUp" type="button" hidden>Konto erstellen</button>
          <div class="languages">
            <button id="account-save" data-text="accountSave" type="button" hidden>Speichern</button>
            <button id="account-load" data-text="accountLoad" type="button" hidden>Laden</button>
            <a class="level-link" href="pages/level.html">Level</a>
            <button id="account-sign-out" data-text="accountSignOut" type="button" hidden>Abmelden</button>
          </div>
          <button id="account-profile" type="button" data-text="accountManage" hidden>Konto verwalten</button>
          <p id="account-status" role="status"></p>
        </div>
        <div class="nav-group">
          <span class="nav-label" data-text="switchGame">Spiel wechseln</span>
          <div class="languages creator-links">
            <a href="pages/mudoku.html">Mudoku</a>
            <a href="pages/wordle.html" data-text="ladderName">Wordle</a>
          </div>
        </div>
        <div class="nav-group">
          <span class="nav-label" data-text="more">Mehr von ashwite</span>
          <div class="languages creator-links">
            <a href="https://gitlab.com/ashwite">GitLab</a>
            <a href="https://github.com/ashwite">GitHub</a>
            <button type="button" disabled>Portfolio</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hier baue ich die Spielfläche für Sudoku auf. -->
  <main>
    <section class="intro">
      <h1 data-text="headline">Denken statt scrollen.</h1>
    </section>
    <section class="game" data-label="game" aria-label="Sudoku-Spiel">
      <!-- Mit JavaScript ergänze ich hier die 81 Felder und die neun Zahlentasten. -->
      <div class="board-wrap">
        <div id="board" role="group" data-label="board" aria-label="Sudoku-Raster"></div>
      </div>
      <div class="number-row">
        <div id="numbers" data-label="numbers" aria-label="Zahlen eingeben"></div>
        <button id="hint-button" type="button" data-label="hint" aria-label="Hinweis">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M9 18h6m-5 3h4m-5-6c0-2-3-3-3-7a6 6 0 0 1 12 0c0 4-3 5-3 7z"/>
          </svg>
        </button>
      </div>
      <p id="hint-message" role="status"></p>
      <!-- Ich stelle die Meldungen für Screenreader bereit und blende sie optisch aus. -->
      <p id="message" class="sr-only" role="status" aria-live="polite"></p>
    </section>
  </main>
  <!-- Unten biete ich die wichtigsten Einstellungen, Konto-Aktionen und Links zu den Infoseiten noch einmal an. -->
  <footer class="site-footer">
    <div class="footer-links">
      <div class="footer-account" role="group" data-label="account" aria-label="Konto">
        <button id="footer-sign-in" type="button" data-text="accountSignIn" hidden>Anmelden</button>
        <button id="footer-profile" type="button" data-text="accountManage" hidden>Konto verwalten</button>
        <button id="footer-save" type="button" data-text="accountSave" hidden>Speichern</button>
        <button id="footer-load" type="button" data-text="accountLoad" hidden>Laden</button>
        <a class="level-link" href="pages/level.html">Level</a>
      </div>
      <div class="levels footer-levels" role="group" data-label="difficulty" aria-label="Schwierigkeitsgrad">
        <button type="button" data-text="easy" data-level="easy">Leicht</button>
        <button type="button" data-text="medium" data-level="medium">Mittel</button>
        <button type="button" data-text="hard" data-level="hard">Schwer</button>
      </div>
      <nav aria-label="Hilfe und rechtliche Informationen" data-label="legal">
        <a href="pages/hilfe.html" data-text="help">Hilfe</a>
        <a href="pages/impressum.html" data-text="imprint">Impressum</a>
        <a href="pages/datenschutz.html" data-text="privacy">Datenschutz</a>
      </nav>
    </div>
    <span id="footer-account-status" role="status"></span>
    <div class="footer-controls">
      <div class="languages footer-languages" role="group" data-label="language" aria-label="Sprache">
        <button type="button" data-language="en" lang="en" aria-label="English">en</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language="de" lang="de" aria-label="Deutsch">de</button>
      </div>
      <button id="theme" class="theme-toggle" aria-label="Dunkelmodus einschalten" aria-pressed="false">
        <span aria-hidden="true">☾</span>
      </button>
    </div>
  </footer>
</body>
</html>
